<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OverlayKit - Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--ac:#7B2CF2;--ac2:#A970FF;--bg:#0b0816;--pn:#14102a;--pn2:#1b1538;--bd:#2c2252;--tx:#f1eaff;--su:#a99bd0}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font:13px/1.35 "Segoe UI",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,select,input,textarea{font:inherit;color:var(--tx)}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
  header h1{margin:0;font-size:16px;white-space:nowrap}
  header h1 b{color:var(--ac2)}
  .grp{display:flex;gap:6px;align-items:center}
  .grp>label{color:var(--su);font-size:12px}
  select,input[type=text],input[type=number],textarea{background:#0e0a20;border:1px solid var(--bd);border-radius:8px;padding:5px 8px;min-width:0}
  input[type=number]{width:72px}
  textarea{width:100%;resize:vertical}
  button{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
  button:hover{border-color:var(--ac2)}
  button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;font-weight:700;color:#fff}
  button.sm{padding:2px 7px;font-size:12px}
  button.on{background:var(--ac);border-color:var(--ac2)}
  main{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;min-height:0}
  @media(max-width:1100px){main{grid-template-columns:200px minmax(0,1fr) 280px}}
  aside{background:var(--pn);overflow:auto;min-height:0}
  #left{border-right:1px solid var(--bd);padding:8px}
  #right{border-left:1px solid var(--bd)}
  h2{margin:6px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac2)}
  .add{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
  .lista{display:flex;flex-direction:column;gap:3px}
  .it{display:flex;align-items:center;gap:4px;padding:4px 6px;border:1px solid transparent;border-radius:8px;cursor:pointer;background:#100c24}
  .it.sel{border-color:var(--ac2);background:#241a4a}
  .it .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it button{padding:0 5px;background:none;border:0;opacity:.7}
  .it button:hover{opacity:1}
  #centro{display:flex;flex-direction:column;min-height:0;min-width:0}
  #barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--bd);background:#100c24}
  #palco{flex:1;overflow:auto;padding:16px;min-height:0;position:relative}
  #palco.xadrez{background:repeating-conic-gradient(#2b2b36 0 25%,#23232d 0 50%) 0 0/24px 24px}
  #palco.escuro{background:#05030a}
  #palco.claro{background:#d8d8e0}
  #palco.jogo{background:linear-gradient(135deg,#1c2b3a,#3a2a52 60%,#10202c)}
  #escala{position:relative;margin:0 auto;box-shadow:0 0 0 1px #ffffff22}
  #root{position:absolute;left:0;top:0}
  #sel{position:absolute;border:2px solid #4ff;pointer-events:none;display:none;z-index:10}
  #sel i{position:absolute;width:11px;height:11px;background:#4ff;border:1px solid #022;pointer-events:auto;border-radius:3px}
  #guias{position:absolute;inset:0;pointer-events:none;z-index:9}
  #guias div{position:absolute;background:#ff3d9a88}
  .ok-el{cursor:move}
  #inspetor{padding:10px}
  .tabs{display:flex;border-bottom:1px solid var(--bd)}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px}
  .tabs button.on{background:var(--pn2);color:#fff;border-bottom:2px solid var(--ac2)}
  .f{display:grid;grid-template-columns:105px 1fr;gap:6px;align-items:center;margin:6px 0}
  .f>span{color:var(--su);font-size:12px}
  .f .c{display:flex;gap:5px;align-items:center}
  .f input[type=range]{width:100%;accent-color:var(--ac2)}
  .f input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
  .f select{width:100%}
  .f .v{min-width:36px;text-align:right;color:var(--ac2)}
  .f4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
  .f4 label{display:flex;flex-direction:column;color:var(--su);font-size:11px}
  .f4 input{width:100%}
  .sep{height:1px;background:var(--bd);margin:10px 0}
  .dica{color:var(--su);font-size:12px}
  #export{padding:8px 10px;border-top:1px solid var(--bd);background:#100c24;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  #link{height:44px;font:11px/1.3 Consolas,monospace;word-break:break-all}
  dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ac2);border-radius:14px;max-width:620px;width:92%}
  dialog::backdrop{background:#000a}
  .vazio{color:var(--su);padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🧩 Overlay<b>Kit</b> <small id="sub" style="color:var(--su);font-weight:400"></small></h1>
  <div class="grp"><label data-t="preset">Modelo</label><select id="preset"></select></div>
  <div class="grp"><label data-t="tema">Tema</label><select id="tema"></select></div>
  <div class="grp"><label data-t="tela">Tela</label><select id="tela"></select></div>
  <div class="grp" style="margin-left:auto">
    <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button>
    <button id="imp" data-t="importar">Importar</button>
    <select id="lang"><option value="pt">Português</option><option value="en">English</option></select>
  </div>
</header>

<main>
  <aside id="left">
    <h2 data-t="adicionar">Adicionar</h2>
    <div class="add" id="add"></div>
    <h2 data-t="camadas">Camadas</h2>
    <div class="lista" id="lista"></div>
    <p class="dica" data-t="dicaLista" style="margin-top:10px"></p>
  </aside>

  <section id="centro">
    <div id="barra">
      <div class="grp"><label data-t="zoom">Zoom</label><input type="range" id="zoom" min="10" max="150" value="50" style="width:110px"><span id="zv"></span><button id="fit" data-t="ajustar">Ajustar</button></div>
      <div class="grp"><label data-t="fundo">Fundo</label><select id="pbg"><option value="xadrez">Xadrez</option><option value="escuro">Escuro</option><option value="claro">Claro</option><option value="jogo">Jogo (exemplo)</option></select></div>
      <div class="grp"><label data-t="grade">Grade</label><select id="snap"><option value="0">Off</option><option value="5">5 px</option><option value="10" selected>10 px</option><option value="20">20 px</option><option value="40">40 px</option></select></div>
      <label class="grp"><input type="checkbox" id="guiasck" checked><span data-t="guias">Guias</span></label>
      <label class="grp"><input type="checkbox" id="embck"><span data-t="embeds">Carregar chat/widgets na prévia</span></label>
    </div>
    <div id="palco" class="xadrez"><div id="escala"><div id="root"></div><div id="guias"></div><div id="sel"></div></div></div>
    <div id="export">
      <textarea id="link" readonly></textarea>
      <div class="grp" style="flex-wrap:wrap;justify-content:flex-end">
        <button class="pri" id="copiar" data-t="copiar">📋 Copiar link</button>
        <button id="abrir" data-t="abrir">Abrir</button>
        <button id="cjson" data-t="cjson">Copiar JSON</button>
        <button id="bjson" data-t="bjson">Baixar JSON</button>
      </div>
    </div>
  </section>

  <aside id="right">
    <div class="tabs"><button id="tabE" class="on" data-t="elemento">Elemento</button><button id="tabG" data-t="geral">Geral</button></div>
    <div id="inspetor"></div>
  </aside>
</main>

<dialog id="dlg">
  <h2 data-t="importar">Importar</h2>
  <p class="dica" data-t="impDica"></p>
  <textarea id="impTxt" rows="8"></textarea>
  <div class="grp" style="margin-top:10px;justify-content:flex-end">
    <input type="file" id="impFile" accept=".json,application/json">
    <button id="impCancel" data-t="cancelar">Cancelar</button>
    <button class="pri" id="impOk" data-t="aplicar">Aplicar</button>
  </div>
</dialog>

<script src="overlay.js"></script>
<script src="presets.js"></script>
<script>
(() => {
'use strict';
const K = OverlayKit, $ = id => document.getElementById(id);

/* ---------- idioma ---------- */
const UI = {
  pt: { preset:'Modelo', tema:'Tema', tela:'Tela', importar:'Importar', adicionar:'Adicionar', camadas:'Camadas', zoom:'Zoom', ajustar:'Ajustar', fundo:'Fundo da prévia', grade:'Grade', guias:'Guias', embeds:'Carregar chat/widgets na prévia',
    copiar:'📋 Copiar link', abrir:'Abrir', cjson:'Copiar JSON', bjson:'Baixar JSON', elemento:'Elemento', geral:'Geral', cancelar:'Cancelar', aplicar:'Aplicar',
    dicaLista:'Dica: arraste os elementos no quadro, use as alças para redimensionar e as setas do teclado para ajustar (Shift = 10px). Delete apaga, Ctrl+D duplica.',
    impDica:'Cole um link do OverlayKit ou o JSON de uma configuração (ou escolha um arquivo .json).', nada:'Selecione um elemento para editar.', semEl:'Nenhum elemento ainda. Use "Adicionar".',
    posicao:'Posição e tamanho', aparencia:'Aparência', conteudo:'Conteúdo', copiado:'Copiado!', invalido:'Não consegui ler essa configuração.', tamLink:'caracteres no link',
    obs:'No OBS: Fonte → Navegador, desmarque "Arquivo local" (ou marque, se estiver no PC) e use largura × altura =', dup:'Duplicar', del:'Excluir', canvas:'Tela (canvas)', tamanho:'Tamanho', cores:'Cores do tema', tipografia:'Fonte', bgT:'Fundo do overlay',
    resetar:'Restaurar modelo', temaPers:'Personalizado', chatTw:'Chat da Twitch (popout)', chatBC:'TeuzinBetterChat', canal:'Canal', aplicarCanal:'Preencher URL', tipos:{frame:'Quadro',text:'Texto',image:'Imagem',lower:'Barra com avatar',clock:'Relógio',embed:'Chat / widget',ticker:'Frases em rotação',bar:'Barra de meta',countdown:'Contagem regressiva'} },
  en: { preset:'Template', tema:'Theme', tela:'Canvas', importar:'Import', adicionar:'Add', camadas:'Layers', zoom:'Zoom', ajustar:'Fit', fundo:'Preview bg', grade:'Grid', guias:'Guides', embeds:'Load chat/widgets in preview',
    copiar:'📋 Copy link', abrir:'Open', cjson:'Copy JSON', bjson:'Download JSON', elemento:'Element', geral:'General', cancelar:'Cancel', aplicar:'Apply',
    dicaLista:'Tip: drag elements on the canvas, use the handles to resize and the arrow keys to nudge (Shift = 10px). Delete removes, Ctrl+D duplicates.',
    impDica:'Paste an OverlayKit link or a configuration JSON (or choose a .json file).', nada:'Select an element to edit.', semEl:'No elements yet. Use "Add".',
    posicao:'Position & size', aparencia:'Appearance', conteudo:'Content', copiado:'Copied!', invalido:'Could not read that configuration.', tamLink:'characters in the link',
    obs:'In OBS: Source → Browser, untick "Local file" (or tick it if running locally) and set width × height =', dup:'Duplicate', del:'Delete', canvas:'Canvas', tamanho:'Size', cores:'Theme colors', tipografia:'Font', bgT:'Overlay background',
    resetar:'Reset template', temaPers:'Custom', chatTw:'Twitch chat (popout)', chatBC:'TeuzinBetterChat', canal:'Channel', aplicarCanal:'Fill URL', tipos:{frame:'Frame',text:'Text',image:'Image',lower:'Lower third',clock:'Clock',embed:'Chat / widget',ticker:'Rotating phrases',bar:'Goal bar',countdown:'Countdown'} }
};
let lang = 'pt'; try { lang = localStorage.getItem('overlaykit-lang') || (navigator.language || 'pt').slice(0, 2); } catch (e) {}
if (!UI[lang]) lang = 'pt';
const t = k => UI[lang][k] != null ? UI[lang][k] : k;
const L = (pt, en) => lang === 'en' ? en : pt;

/* ---------- esquema dos elementos ---------- */
const FONT_OPTS = [['', ['Do tema', 'Theme']]].concat(Object.keys(K.FONTS).map(k => [k, K.FONTS[k].label]));
const TZ = [['', ['Do computador', 'This computer']], ['America/Sao_Paulo', 'Brasília'], ['America/Manaus', 'Manaus'], ['America/New_York', 'New York'], ['America/Los_Angeles', 'Los Angeles'], ['Europe/Lisbon', 'Lisboa'], ['Europe/London', 'London'], ['Europe/Madrid', 'Madrid'], ['Asia/Tokyo', 'Tokyo'], ['UTC', 'UTC']];
const ALIGN = [['left', ['Esquerda', 'Left']], ['center', ['Centro', 'Center']], ['right', ['Direita', 'Right']]];
const ANIMS = [['none', ['Nenhuma', 'None']], ['pulse', ['Brilho pulsando', 'Glow pulse']], ['float', ['Flutuando', 'Floating']], ['breathe', ['Respirando', 'Breathing']], ['in', ['Entrada suave', 'Fade in']]];

const F = {
  bw: ['n', ['Borda', 'Border'], 0, 40, 1], r: ['n', ['Arredond.', 'Radius'], 0, 400, 1], bc: ['c', ['Cor da borda', 'Border color']], glow: ['n', ['Brilho', 'Glow'], 0, 120, 1],
  fill: ['c0', ['Preenchimento', 'Fill']], fa: ['n', ['Opac. fundo %', 'Fill opacity %'], 0, 100, 1],
  tag: ['t', ['Etiqueta', 'Tag']], tfs: ['n', ['Tam. etiqueta', 'Tag size'], 10, 80, 1], tc: ['c', ['Cor etiqueta', 'Tag color']],
  txt: ['ta', ['Texto', 'Text'], 4], fs: ['n', ['Tamanho', 'Size'], 8, 400, 1], fw: ['s', ['Peso', 'Weight'], [[400, 'Normal'], [600, 'Semi'], [700, 'Bold'], [800, 'Extra']]],
  c: ['c', ['Cor', 'Color']], al: ['s', ['Alinhar', 'Align'], ALIGN], va: ['s', ['Vertical', 'Vertical'], [['top', ['Topo', 'Top']], ['middle', ['Meio', 'Middle']], ['bottom', ['Base', 'Bottom']]]],
  up: ['k', ['MAIÚSCULAS', 'UPPERCASE']], it: ['k', ['Itálico', 'Italic']], sh: ['k', ['Sombra/brilho', 'Glow shadow']], shc: ['c', ['Cor sombra', 'Shadow color']],
  lh: ['n', ['Entrelinha', 'Line height'], 0.8, 3, 0.05], ls: ['n', ['Espaç. letras', 'Letter spacing'], -5, 40, 0.5], fam: ['s', ['Fonte', 'Font'], FONT_OPTS],
  src: ['t', ['URL da imagem', 'Image URL']], fit: ['s', ['Ajuste', 'Fit'], [['cover', ['Preencher', 'Cover']], ['contain', ['Conter', 'Contain']]]],
  t1: ['t', ['Título', 'Title']], t2: ['t', ['Subtítulo', 'Subtitle']], t3: ['t', ['Texto à direita', 'Right text']], av: ['t', ['URL do avatar', 'Avatar URL']], avsq: ['k', ['Avatar quadrado', 'Square avatar']], noav: ['k', ['Ocultar avatar', 'Hide avatar']],
  avc: ['c', ['Borda avatar', 'Avatar ring']], c1: ['c', ['Cor título', 'Title color']], c2: ['c', ['Cor subtítulo', 'Subtitle color']], c3: ['c', ['Cor dir.', 'Right color']], fsp: ['n', ['Escala texto %', 'Text scale %'], 50, 200, 5],
  tz: ['s', ['Fuso', 'Timezone'], TZ], sec: ['k', ['Mostrar segundos', 'Show seconds']], lab: ['t', ['Legenda', 'Caption']],
  url: ['t', ['URL', 'URL']], items: ['ta', ['Frases (1 por linha)', 'Phrases (1 per line)'], 5], secs: ['n', ['Troca a cada (s)', 'Change every (s)'], 2, 120, 1],
  val: ['n', ['Valor atual', 'Current value'], 0, 1e9, 1], max: ['n', ['Meta', 'Goal'], 1, 1e9, 1], pct: ['k', ['Mostrar %', 'Show %']], cur: ['t', ['Prefixo (R$…)', 'Prefix ($…)']],
  min: ['n', ['Minutos', 'Minutes'], 0, 600, 1], at: ['t', ['Ou até as (HH:MM)', 'Or until (HH:MM)']], done: ['t', ['Texto no fim', 'Text at the end']], hours: ['k', ['Mostrar horas', 'Show hours']],
  fc: ['c', ['Cor barra', 'Bar color']], fc2: ['c', ['Cor barra 2', 'Bar color 2']]
};
const AP = ['Aparência', 'Appearance'], CT = ['Conteúdo', 'Content'];
const SCHEMA = {
  frame: { name: 'tag', g: [[AP, ['bw', 'r', 'bc', 'glow', 'fill', 'fa']], [['Etiqueta', 'Tag'], ['tag', 'tfs', 'tc']]] },
  text: { name: 'txt', g: [[CT, ['txt', 'fam', 'fs', 'fw', 'c', 'al', 'va']], [['Estilo', 'Style'], ['up', 'it', 'sh', 'shc', 'lh', 'ls']]] },
  image: { name: 'src', g: [[['Imagem', 'Image'], ['src', 'fit', 'r', 'bw', 'bc', 'glow']]] },
  lower: { name: 't1', g: [[CT, ['t1', 't2', 't3', 'av', 'noav', 'avsq', 'fsp']], [AP, ['bw', 'r', 'bc', 'glow', 'fill', 'fa', 'c1', 'c2', 'c3', 'avc']]] },
  clock: { name: 'lab', g: [[['Relógio', 'Clock'], ['tz', 'sec', 'lab', 'fam', 'fs', 'c', 'al', 'sh']]] },
  embed: { name: 'url', g: [[['Chat / widget', 'Chat / widget'], ['url', 'r', 'bw', 'bc', 'fill', 'fa']]] },
  ticker: { name: 'items', g: [[CT, ['items', 'secs', 'fs', 'fw', 'c', 'al']], [AP, ['fill', 'fa', 'r', 'bw', 'bc']]] },
  countdown: { name: 'lab', g: [[['Contagem regressiva', 'Countdown'], ['min', 'at', 'done', 'hours', 'lab', 'fam', 'fs', 'c', 'al', 'sh']]] },
  bar: { name: 'lab', g: [[['Meta', 'Goal'], ['lab', 'val', 'max', 'pct', 'cur', 'fs']], [AP, ['bw', 'r', 'bc', 'glow', 'fill', 'fa', 'fc', 'fc2', 'c']]] }
};
const ICON = { frame: '▭', text: 'T', image: '🖼', lower: '▬', clock: '🕒', embed: '💬', ticker: '🔁', bar: '🎯', countdown: '⏳' };
const DEF = {
  frame: { w: 600, h: 340, bw: 6, r: 28, bc: 'p', glow: 0, tag: '' },
  text: { w: 600, h: 100, txt: 'Seu texto', fs: 48, fw: 700, c: 'tx', al: 'left' },
  image: { w: 300, h: 300, src: '', fit: 'cover', r: 28, bw: 0, bc: 'p' },
  lower: { w: 900, h: 160, bw: 4, r: 30, bc: 'a', fill: 'pn', fa: 95, t1: 'seucanal', t2: 'twitch.tv/seucanal', t3: '' },
  clock: { w: 420, h: 120, fs: 90, al: 'center', sh: true, lab: '', tz: '' },
  embed: { w: 560, h: 700, r: 24, url: '', bw: 0, bc: 'p' },
  ticker: { w: 900, h: 70, fs: 32, c: 'a', al: 'center', sec: 8, items: 'Frase 1\nFrase 2\nFrase 3' },
  countdown: { w: 600, h: 150, fs: 120, al: 'center', sh: true, min: 5, done: 'Começando!', lab: '' },
  bar: { w: 640, h: 80, bw: 5, r: 28, bc: 'p', fill: 'pn', fa: 95, lab: 'Meta', val: 30, max: 100, fs: 28, pct: false, cur: '' }
};

/* ---------- estado ---------- */
let cfg, sel = null, tab = 'E', zoom = 0.5, hist = [], histI = -1, presetKey = 'jogo';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'e' + Math.random().toString(36).slice(2, 7);
function load(c) { cfg = K.normalize(clone(c)); sel = null; hist = []; histI = -1; commit(true); fullRender(); }
function commit(silent) {
  const snap = JSON.stringify(cfg);
  if (hist[histI] === snap) return;
  hist = hist.slice(0, histI + 1); hist.push(snap); if (hist.length > 80) hist.shift(); histI = hist.length - 1;
  if (!silent) save();
}
function save() { try { localStorage.setItem('overlaykit-cfg', JSON.stringify(cfg)); } catch (e) {} }
function undo(d) { const i = histI + d; if (i < 0 || i >= hist.length) return; histI = i; cfg = JSON.parse(hist[i]); if (!cfg.els.find(e => e.id === sel)) sel = null; save(); fullRender(); }
const getSel = () => cfg.els.find(e => e.id === sel);
const nameOf = e => { const f = (SCHEMA[e.type] || {}).name; let n = String(e[f] || '').split('\n')[0].replace(/https?:\/\//, '').slice(0, 26); return (n ? n : t('tipos')[e.type]); };

/* ---------- renderizacao do palco ---------- */
function fullRender() {
  const r = $('root');
  K.render(cfg, r, { editor: true, noEmbed: !$('embck').checked });
  applyZoom(); drawList(); drawInspector(); drawSel(); updateLink();
}
function applyZoom() {
  const z = zoom, c = cfg.canvas;
  $('escala').style.width = c.w * z + 'px'; $('escala').style.height = c.h * z + 'px';
  $('root').style.transform = `scale(${z})`; $('zv').textContent = Math.round(z * 100) + '%'; $('zoom').value = Math.round(z * 100);
}
function fitZoom() {
  const p = $('palco'); const z = Math.min((p.clientWidth - 34) / cfg.canvas.w, (p.clientHeight - 34) / cfg.canvas.h);
  zoom = Math.max(.1, Math.min(1.5, z)); applyZoom(); drawSel();
}
function geoUpdate(e) {                     // so geometria: sem re-render completo
  const n = $('root').querySelector(`[data-id="${e.id}"]`); if (!n) return fullRender();
  n.style.left = e.x + 'px'; n.style.top = e.y + 'px'; n.style.width = e.w + 'px'; n.style.height = e.h + 'px';
}
const HANDLES = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
function drawSel() {
  const s = $('sel'), e = getSel(); s.innerHTML = '';
  if (!e) { s.style.display = 'none'; return; }
  const z = zoom; s.style.display = 'block';
  s.style.left = e.x * z + 'px'; s.style.top = e.y * z + 'px'; s.style.width = e.w * z + 'px'; s.style.height = e.h * z + 'px';
  s.style.transform = e.rot ? `rotate(${e.rot}deg)` : '';
  HANDLES.forEach(h => {
    const i = document.createElement('i'); i.dataset.h = h;
    const x = h.includes('w') ? 0 : h.includes('e') ? 100 : 50, y = h.includes('n') ? 0 : h.includes('s') ? 100 : 50;
    i.style.cssText = `left:calc(${x}% - 6px);top:calc(${y}% - 6px);cursor:${h === 'n' || h === 's' ? 'ns' : h === 'e' || h === 'w' ? 'ew' : (h === 'nw' || h === 'se') ? 'nwse' : 'nesw'}-resize`;
    s.appendChild(i);
  });
}
function guide(list) {
  const g = $('guias'); g.innerHTML = '';
  if (!$('guiasck').checked) return;
  list.forEach(([o, v]) => { const d = document.createElement('div'); d.style.cssText = o === 'v' ? `left:${v * zoom}px;top:0;bottom:0;width:1px` : `top:${v * zoom}px;left:0;right:0;height:1px`; g.appendChild(d); });
}

/* ---------- interacao: mover / redimensionar ---------- */
let drag = null;
const snapV = v => { const g = +$('snap').value; return g ? Math.round(v / g) * g : Math.round(v); };
function pt(ev) { const r = $('escala').getBoundingClientRect(); return { x: (ev.clientX - r.left) / zoom, y: (ev.clientY - r.top) / zoom }; }
$('escala').addEventListener('pointerdown', ev => {
  const h = ev.target.dataset && ev.target.dataset.h;
  if (h) { const e = getSel(); drag = { mode: 'resize', h, e, start: pt(ev), o: { x: e.x, y: e.y, w: e.w, h: e.h } }; ev.target.setPointerCapture(ev.pointerId); ev.preventDefault(); return; }
  const n = ev.target.closest('.ok-el');
  if (!n) { sel = null; drawSel(); drawList(); drawInspector(); return; }
  const e = cfg.els.find(x => x.id === n.dataset.id); if (!e) return;
  if (sel !== e.id) { sel = e.id; drawSel(); drawList(); drawInspector(); }
  drag = { mode: 'move', e, start: pt(ev), o: { x: e.x, y: e.y, w: e.w, h: e.h } };
  $('escala').setPointerCapture(ev.pointerId); ev.preventDefault();
});
addEventListener('pointermove', ev => {
  if (!drag) return;
  const p = pt(ev), dx = p.x - drag.start.x, dy = p.y - drag.start.y, e = drag.e, o = drag.o, W = cfg.canvas.w, H = cfg.canvas.h, gl = [];
  if (drag.mode === 'move') {
    e.x = snapV(o.x + dx); e.y = snapV(o.y + dy);
    const T = 8 / zoom;                                   // imã nas bordas e no centro do canvas
    [[e.x, 0, 'v'], [e.x + e.w, W, 'v'], [e.x + e.w / 2, W / 2, 'v']].forEach(([a, b, o2]) => { if (Math.abs(a - b) < T) { e.x += b - a; gl.push([o2, b]); } });
    [[e.y, 0, 'h'], [e.y + e.h, H, 'h'], [e.y + e.h / 2, H / 2, 'h']].forEach(([a, b, o2]) => { if (Math.abs(a - b) < T) { e.y += b - a; gl.push([o2, b]); } });
  } else {
    const h = drag.h; let x = o.x, y = o.y, w = o.w, hh = o.h;
    if (h.includes('e')) w = Math.max(10, snapV(o.w + dx));
    if (h.includes('s')) hh = Math.max(10, snapV(o.h + dy));
    if (h.includes('w')) { const nx = snapV(o.x + dx); w = Math.max(10, o.w + (o.x - nx)); x = o.x + o.w - w; }
    if (h.includes('n')) { const ny = snapV(o.y + dy); hh = Math.max(10, o.h + (o.y - ny)); y = o.y + o.h - hh; }
    e.x = x; e.y = y; e.w = w; e.h = hh;
  }
  guide(gl); geoUpdate(e); drawSel(); syncGeoInputs(e);
});
addEventListener('pointerup', () => { if (!drag) return; const was = drag; drag = null; guide([]); if (was.e.type === 'lower' || was.e.type === 'embed' || was.e.type === 'frame' || was.e.type === 'bar' || was.e.type === 'ticker' || was.e.type === 'clock' || was.e.type === 'text' || was.e.type === 'image') { fullRenderKeep(); } commit(); });
function fullRenderKeep() { const r = $('root'); K.render(cfg, r, { editor: true, noEmbed: !$('embck').checked }); applyZoom(); drawSel(); updateLink(); }

addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { if (typing && tag !== 'select') return; ev.preventDefault(); undo(ev.shiftKey ? 1 : -1); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); undo(1); return; }
  if (typing) return;
  const e = getSel(); if (!e) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'd') { ev.preventDefault(); dupEl(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); delEl(); return; }
  const st = ev.shiftKey ? 10 : 1;
  const mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[ev.key];
  if (mv) { ev.preventDefault(); e.x += mv[0]; e.y += mv[1]; geoUpdate(e); drawSel(); syncGeoInputs(e); clearTimeout(window.__nt); window.__nt = setTimeout(() => { commit(); fullRenderKeep(); }, 300); }
});

/* ---------- operacoes ---------- */

}
function dupEl() { const e = getSel(); if (!e) return; const n = clone(e); n.id = uid(); n.x += 30; n.y += 30; cfg.els.splice(cfg.els.indexOf(e) + 1, 0, n); sel = n.id; commit(); fullRender(); }
function delEl() { const e = getSel(); if (!e) return; cfg.els.splice(cfg.els.indexOf(e), 1); sel = null; commit(); fullRender(); }
function moveZ(id, d) { const i = cfg.els.findIndex(e => e.id === id), j = i + d; if (j < 0 || j >= cfg.els.length) return; const [x] = cfg.els.splice(i, 1); cfg.els.splice(j, 0, x); commit(); fullRender(); }

/* ---------- lista de camadas ---------- */
function drawList() {
  const l = $('lista'); l.innerHTML = '';
  if (!cfg.els.length) { l.innerHTML = `<div class="vazio">${t('semEl')}</div>`; return; }
  cfg.els.slice().reverse().forEach(e => {
    const d = document.createElement('div'); d.className = 'it' + (e.id === sel ? ' sel' : ''); d.dataset.id = e.id;
    d.innerHTML = `<span>${ICON[e.type] || '▫'}</span><span class="n">${K.esc(nameOf(e))}</span>` +
      `<button data-a="eye" title="visível">${e.hide ? '🚫' : '👁'}</button><button data-a="up" title="↑">▲</button><button data-a="dn" title="↓">▼</button>`;
    d.onclick = ev => {
      const a = ev.target.dataset.a;
      if (a === 'eye') { e.hide = !e.hide; commit(); fullRender(); return; }
      if (a === 'up') { moveZ(e.id, 1); return; }
      if (a === 'dn') { moveZ(e.id, -1); return; }
      sel = e.id; drawList(); drawInspector(); drawSel(); tab = 'E'; setTab();

    l.appendChild(d);

function updateLink() {

  $('sub').textContent = `${cfg.canvas.w}×${cfg.canvas.h} · ${l.length} ${t('tamLink')}`;
  $('link').title = t('obs') + ' ' + cfg.canvas.w + ' × ' + cfg.canvas.h;
}
async function copy(txt) { try { await navigator.clipboard.writeText(txt); } catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } }

$('copiar').onclick = async () => { await copy($('link').value); toast($('copiar'), t('copiado')); };
$('cjson').onclick = async () => { await copy(JSON.stringify(cfg, null, 2)); toast($('cjson'), t('copiado')); };
$('bjson').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' })); a.download = 'overlay-config.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
$('abrir').onclick = () => window.open($('link').value + '&preview=1', '_blank');
$('imp').onclick = () => { $('impTxt').value = ''; $('dlg').showModal(); };
$('impCancel').onclick = () => $('dlg').close();
$('impFile').onchange = async () => { const f = $('impFile').files[0]; if (f) $('impTxt').value = await f.text(); };
$('impOk').onclick = () => {
  try {
    let txt = $('impTxt').value.trim(), o;
    if (/^https?:|^file:/i.test(txt) || txt.includes('?c=')) { const u = new URL(txt, location.href); o = K.b64dec(u.searchParams.get('c')); } else o = JSON.parse(txt);
    load(o); $('dlg').close(); fitZoom();
  } catch (e) { alert(t('invalido')); }
};

  const gr = {};
  Object.keys(OverlayPresets).forEach(k => { const p = OverlayPresets[k], gk = p.grupo || 'h';
    if (!gr[gk]) { gr[gk] = document.createElement('optgroup'); gr[gk].label = ({ h: L('Horizontal (16:9)', 'Horizontal (16:9)'), v: L('Vertical (9:16)', 'Vertical (9:16)'), x: L('Outros', 'Other') })[gk] || gk; ps.appendChild(gr[gk]); }
    const o = document.createElement('option'); o.value = k; o.textContent = p.nome[lang]; gr[gk].appendChild(o); });
  ps.value = presetKey;
  const ts = $('tema'); ts.innerHTML = `<option value="">${t('temaPers')}</option>`;
  Object.keys(OverlayThemes).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = OverlayThemes[k].nome[lang]; ts.appendChild(o); });
  const tl = $('tela'); tl.innerHTML = ''; [['1920x1080', '1920×1080 (16:9)'], ['1280x720', '1280×720 (16:9)'], ['2560x1440', '2560×1440 (16:9)'], ['1080x1920', '1080×1920 (9:16)'], ['1080x1080', '1080×1080 (1:1)']].forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; tl.appendChild(o); });
  tl.value = cfg ? cfg.canvas.w + 'x' + cfg.canvas.h : '1920x1080';
}
$('preset').onchange = () => { presetKey = $('preset').value; load(OverlayPresets[presetKey].cfg); fillSelects(); fitZoom(); };
$('tema').onchange = () => { const k = $('tema').value; if (!k) return; Object.assign(cfg.theme, OverlayThemes[k].t); commit(); fullRender(); };
$('tela').onchange = () => {
  const [w, h] = $('tela').value.split('x').map(Number); const ow = cfg.canvas.w, oh = cfg.canvas.h;
  if (confirm(L('Reescalar os elementos para o novo tamanho?', 'Rescale elements to the new size?'))) { const sx = w / ow, sy = h / oh; cfg.els.forEach(e => { e.x = Math.round(e.x * sx); e.w = Math.round(e.w * sx); e.y = Math.round(e.y * sy); e.h = Math.round(e.h * sy); }); }
  cfg.canvas.w = w; cfg.canvas.h = h; commit(); fullRender(); fitZoom();
};
$('lang').onchange = () => { lang = $('lang').value; try { localStorage.setItem('overlaykit-lang', lang); } catch (e) {} applyLang(); };
$('zoom').oninput = () => { zoom = +$('zoom').value / 100; applyZoom(); drawSel(); };
$('fit').onclick = fitZoom;
$('pbg').onchange = () => { $('palco').className = $('pbg').value; };
$('embck').onchange = () => fullRender();
$('undo').onclick = () => undo(-1); $('redo').onclick = () => undo(1);
addEventListener('resize', () => { if (cfg) fitZoom(); });
function buildAdd() { const a = $('add'); a.innerHTML = ''; Object.keys(DEF).forEach(k => { const b = document.createElement('button'); b.textContent = ICON[k] + ' ' + t('tipos')[k]; b.onclick = () => addEl(k); a.appendChild(b); }); }
function applyLang() {
  document.documentElement.lang = lang; $('lang').value = lang;
  document.querySelectorAll('[data-t]').forEach(n => { const v = t(n.dataset.t); if (v) n.textContent = v; });
  buildAdd(); fillSelects(); if (cfg) fullRender();
}

/* ---------- inicio ---------- */
(function init() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('overlaykit-cfg') || 'null'); } catch (e) {}
  const P = new URLSearchParams(location.search);
  try { if (P.get('c')) saved = K.b64dec(P.get('c')); } catch (e) {}
  cfg = K.normalize(clone(saved && saved.els ? saved : OverlayPresets.jogo.cfg));
  $('lang').value = lang; applyLang();
  commit(true); fullRender(); fitZoom();
  setTimeout(fitZoom, 60);
})();
})();
</script>
</body>
</html>
